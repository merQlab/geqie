# Builds the geqie-qml package and publishes it to TestPyPI or PyPI via Trusted Publishing (OIDC).
# - Run manually (workflow_dispatch) from the `qml-experiments` branch and choose the target; only pre-release versions (e.g. 0.4.0a1) are accepted.

name: Publish geqie-qml

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options:
        - testpypi
        - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/qml-experiments'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up uv with Python 3.12
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.12"
    - name: Verify version is a pre-release
      run: |
        uv run --no-project --with packaging python - <<'EOF'
        import sys, tomllib
        from packaging.version import Version
        version = tomllib.load(open("geqie-qml/pyproject.toml", "rb"))["project"]["version"]
        if not Version(version).is_prerelease:
            sys.exit(f"::error::geqie-qml version {version} is not a pre-release")
        print(f"Publishing geqie-qml {version}")
        EOF
    - name: Build sdist and wheel
      run: uv build geqie-qml --out-dir dist
    - name: Check distributions
      run: uvx twine check --strict dist/*
    - uses: actions/upload-artifact@v4
      with:
        name: geqie-qml-dist
        path: dist/

  publish-pypi:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/geqie-qml
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: geqie-qml-dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/geqie-qml
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: geqie-qml-dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
